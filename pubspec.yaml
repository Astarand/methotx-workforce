name: methotx_workforce
description: MethotX Workforce - Premium Corporate HRMS Hybrid Mobile Application
publish_to: 'none'

# Current Production Release Version (SemVer + BuildNumber)
version: 1.1.1+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ===========================================================================
  # 🎨 UI, Typography & Localization
  # ===========================================================================
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  intl: ^0.20.2

  # ===========================================================================
  # ⚡ State Management & Navigation Architecture
  # ===========================================================================
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.1

  # ===========================================================================
  # 🌐 Networking & REST API Engine
  # ===========================================================================
  dio: ^5.8.0+1
  http_parser: ^4.1.2
  url_launcher: ^6.3.1

  # ===========================================================================
  # 🔐 Security, Biometrics & Hardware Protection
  # ===========================================================================
  local_auth: ^3.0.2
  crypto: ^3.0.6
  flutter_secure_storage: ^11.0.0
  flutter_dotenv: ^6.0.1

  # ===========================================================================
  # 💾 Local Storage, Caching & Offline Persistence
  # ===========================================================================
  shared_preferences: ^2.5.4
  path_provider: ^2.1.6
  cached_network_image: ^4.0.0
  flutter_cache_manager: ^3.4.1

  # ===========================================================================
  # 📍 Hardware Geolocation & Runtime Permissions
  # ===========================================================================
  geolocator: ^14.0.3
  permission_handler: ^13.0.1

  # ===========================================================================
  # 🔥 Firebase Cloud Infrastructure
  # ===========================================================================
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  firebase_remote_config: ^6.7.0

  # ===========================================================================
  # 🔔 Push Notifications, App Lifecycle & Versioning
  # ===========================================================================
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  in_app_update: ^5.0.0
  package_info_plus: ^10.0.0

  # ===========================================================================
  # 📄 PDF Generation, Document Viewing & File Picker
  # ===========================================================================
  pdf: ^3.13.0
  printing: ^5.15.0
  open_filex: ^4.7.0
  file_picker: ^12.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/icon/icon_512.png'
  adaptive_icon_background: 'assets/icon/icon_background.png'
  adaptive_icon_foreground: 'assets/icon/icon_512.png'
  remove_alpha_ios: true
